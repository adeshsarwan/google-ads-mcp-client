[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "google-ads-function-gateway"
version = "0.1.0"
description = "Deterministic Google Ads function gateway for approved read-only catalogue functions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Google Ads MCP Client maintainers" }]
dependencies = [
    "google-ads",
    "mcp>=2.1.1,<3",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.8.0"]

[project.scripts]
google-ads-function-gateway = "google_ads_function_gateway.cli:main"
google-ads-function-gateway-mcp = "google_ads_function_gateway.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
